<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Starter · Builder · Craft lanes">
  <defs>
    <style>
      .card { animation: float 4s ease-in-out infinite; }
      .c2 { animation-delay: -1.3s; }
      .c3 { animation-delay: -2.4s; }
      .chip { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%,100% { opacity: .7; }
        50% { opacity: 1; }
      }
    </style>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb923c"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="#020617"/>
  <rect x="40" y="12" width="1120" height="3" rx="2" fill="url(#edge)" opacity=".55"/>
  <!-- Starter -->
  <g class="card">
    <rect x="40" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="70" y="58" width="86" height="22" rx="11" fill="#0ea5e9" opacity=".18"/>
    <text x="113" y="73" text-anchor="middle" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">SHIPPED</text>
    <text x="70" y="108" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">STARTER · DAYS 01–03</text>
    <text x="70" y="142" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Chat · RAG · Tokenizer</text>
    <text x="70" y="168" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">first-commit-ai · notes-rag · tiny-bpe</text>
  </g>
  <!-- Builder -->
  <g class="card c2">
    <rect x="430" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#fb923c" stroke-width="2"/>
    <rect x="460" y="58" width="86" height="22" rx="11" fill="#fb923c" opacity=".22"/>
    <text x="503" y="73" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DAY 04</text>
    <rect class="chip" x="556" y="58" width="78" height="22" rx="11" fill="url(#ember)" opacity=".85"/>
    <text x="595" y="73" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.1">NEXT →</text>
    <text x="460" y="108" fill="#fb923c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BUILDER · TOOL AGENT</text>
    <text x="460" y="142" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">ReAct loop · prompt lab</text>
    <text x="460" y="168" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">tiny-tool-agent shipped · prompt-lab queued</text>
  </g>
  <!-- Craft -->
  <g class="card c3">
    <rect x="820" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#a78bfa" stroke-width="2"/>
    <rect x="850" y="58" width="64" height="22" rx="11" fill="#a78bfa" opacity=".22"/>
    <text x="882" y="73" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">LIVE</text>
    <text x="850" y="108" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">CRAFT · DEMOS</text>
    <text x="850" y="142" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Shop · NVR · Sinhala</text>
    <text x="850" y="168" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Mister Jay · camera · jay-ai-sinhala</text>
  </g>
</svg>
