<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Starter · Builder · Craft lanes">
  <defs>
    <style>
      .card { animation: float 4s ease-in-out infinite; }
      .c2 { animation-delay: -1.3s; }
      .c3 { animation-delay: -2.4s; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="#020617"/>
  <rect x="40" y="12" width="1120" height="3" rx="2" fill="url(#edge)" opacity=".55"/>
  <g class="card">
    <rect x="40" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="78" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">STARTER · DAYS 01–03</text>
    <text x="70" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Chat · RAG · Tokenizer</text>
    <text x="70" y="150" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">first-commit-ai · notes-rag · tiny-bpe</text>
  </g>
  <g class="card c2">
    <rect x="430" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#fb923c" stroke-width="2"/>
    <text x="460" y="78" fill="#fb923c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BUILDER · MID</text>
    <text x="460" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Attention → agents</text>
    <text x="460" y="150" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">attention-warrior · tool agent next</text>
  </g>
  <g class="card c3">
    <rect x="820" y="36" width="340" height="152" rx="18" fill="url(#a)" stroke="#a78bfa" stroke-width="2"/>
    <text x="850" y="78" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">CRAFT · LIVE</text>
    <text x="850" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Shop · NVR · Sinhala</text>
    <text x="850" y="150" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Mister Jay · camera · jay-ai-sinhala</text>
  </g>
</svg>
