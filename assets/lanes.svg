<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <style>
      .card { animation: float 4s ease-in-out infinite; }
      .c2 { animation-delay: -1.3s; }
      .c3 { animation-delay: -2.4s; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
  <rect width="1200" height="220" fill="#020617"/>
  <g class="card">
    <rect x="40" y="40" width="340" height="140" rx="18" fill="url(#a)" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="95" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700">STARTER</text>
    <text x="70" y="130" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">First commit AI</text>
    <text x="70" y="160" fill="#94a3b8" font-family="sans-serif" font-size="15">clone · run · understand</text>
  </g>
  <g class="card c2">
    <rect x="430" y="40" width="340" height="140" rx="18" fill="url(#a)" stroke="#fb923c" stroke-width="2"/>
    <text x="460" y="95" fill="#fb923c" font-family="sans-serif" font-size="18" font-weight="700">BUILDER</text>
    <text x="460" y="130" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">Agents &amp; RAG toys</text>
    <text x="460" y="160" fill="#94a3b8" font-family="sans-serif" font-size="15">tools · memory · evals</text>
  </g>
  <g class="card c3">
    <rect x="820" y="40" width="340" height="140" rx="18" fill="url(#a)" stroke="#a78bfa" stroke-width="2"/>
    <text x="850" y="95" fill="#a78bfa" font-family="sans-serif" font-size="18" font-weight="700">CRAFT</text>
    <text x="850" y="130" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">Shop skills + systems</text>
    <text x="850" y="160" fill="#94a3b8" font-family="sans-serif" font-size="15">Mister Jay · DIY NVR</text>
  </g>
</svg>
