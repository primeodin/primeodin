<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PrimeOdin — shop-taught systems">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="50%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="100%" stop-color="#8fa3bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .spark { animation: rise 3.2s ease-in-out infinite; }
      .spark2 { animation: rise 4.1s ease-in-out infinite; animation-delay: -1.2s; }
      .spark3 { animation: rise 2.7s ease-in-out infinite; animation-delay: -0.6s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .sweep { animation: sweep 8s linear infinite; }
      .type { animation: typeIn 1.8s ease-out both; }
      @keyframes rise {
        0%,100% { transform: translateY(0); opacity: .25; }
        50% { transform: translateY(-18px); opacity: 1; }
      }
      @keyframes pulse {
        0%,100% { opacity: .55; }
        50% { opacity: 1; }
      }
      @keyframes sweep {
        0% { transform: translateX(-120px); opacity: 0; }
        15% { opacity: .7; }
        50% { opacity: .35; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes typeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)"/>
  <g opacity=".18" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 280 H1200"/>
    <path d="M0 300 H1200"/>
    <path d="M0 320 H1200"/>
    <path d="M120 260 V360 M240 250 V360 M360 245 V360 M480 250 V360 M600 255 V360 M720 250 V360 M840 245 V360 M960 250 V360 M1080 260 V360"/>
  </g>
  <ellipse cx="210" cy="290" rx="120" ry="28" fill="#ff6a3d" opacity=".25" filter="url(#glow)" class="pulse"/>
  <g transform="translate(140,210)">
    <path d="M20 70 h140 l20-18 h-40 l-10-22 h-80 l-10 22 h-40 z" fill="url(#steel)"/>
    <rect x="70" y="70" width="40" height="40" fill="#6b7c93"/>
    <rect x="40" y="108" width="100" height="14" rx="3" fill="#4b5a70"/>
  </g>
  <g transform="translate(250,150) rotate(-18)" class="pulse">
    <rect x="0" y="40" width="70" height="28" rx="4" fill="#cfd8e6"/>
    <rect x="28" y="68" width="14" height="70" rx="3" fill="#8b5a2b"/>
  </g>
  <g fill="none" stroke="url(#ember)" stroke-width="2" opacity=".85" filter="url(#glow)">
    <path d="M420 120 C480 80, 560 80, 620 120 S760 180, 820 140"/>
    <circle cx="420" cy="120" r="5" fill="#ffb347"/>
    <circle cx="620" cy="120" r="5" fill="#7dd3fc"/>
    <circle cx="820" cy="140" r="5" fill="#ff6a3d"/>
  </g>
  <g fill="#ffb347">
    <circle class="spark" cx="190" cy="240" r="3"/>
    <circle class="spark2" cx="230" cy="250" r="2.5"/>
    <circle class="spark3" cx="205" cy="255" r="2"/>
    <circle class="spark" cx="260" cy="235" r="2"/>
  </g>
  <rect class="sweep" x="0" y="0" width="80" height="360" fill="#7dd3fc" opacity=".08"/>
  <g class="type">
    <text x="420" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="750" fill="#f8fafc">PrimeOdin</text>
    <text x="420" y="220" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#94a3b8">Shop-taught systems · tools that teach · code that holds</text>
    <text x="420" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7dd3fc">daily public builds for people learning AI by shipping</text>
  </g>
</svg>
